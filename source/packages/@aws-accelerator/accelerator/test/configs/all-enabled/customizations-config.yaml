customizations:
  cloudFormationStacks:
    # --------------------------------------------------
    # 1) Data Collection Account Stack (the "Destination" for CUR)
    # --------------------------------------------------
    - name: CUR-Destination-Stack
      description: "Data Collection Account: Create Bucket and Athena Tables"
      template: cloudformation-templates/cur-destination.yaml
        # Could also be an S3 URL, e.g.:
        # template: https://s3.amazonaws.com/my-bucket/cur-destination.yaml
      runOrder: 1
      terminationProtection: false
      parameters:
        - name: SourceAccounts
          value: "111111111111,222222222222"
          # Example: Comma-separated list of source account IDs
        - name: ManageCUR2
          value: "yes"
          # Example: If the template expects a parameter telling it to manage CUR v2
      deploymentTargets:
        accounts:
          - DataCollectionAccount  # <-- The logical account name as defined in LZA
        regions:
          - us-east-1

    # --------------------------------------------------
    # 2) Management/Payer/Source Account Stack (creates CUR & replication)
    # --------------------------------------------------
    - name: CUR-Setup-Replication
      description: "Management/Payer/Source Account: Create CUR 2.0 and Replication"
      template: cloudformation-templates/cur-source.yaml
      runOrder: 2
      terminationProtection: false
      parameters:
        - name: DestinationBucketName
          value: "cur-destination-bucket"
          # Must match the bucket created in stack #1
        - name: SomeOtherParameter
          value: "some-value"
      deploymentTargets:
        accounts:
          - Management  # or Payer, or whatever you call your payer account in LZA config
        regions:
          - us-east-1
